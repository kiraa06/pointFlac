name: PointFlac
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  PointFlacKit:
    path: Packages/PointFlacKit
targets:
  PointFlac:
    type: application
    platform: iOS
    # Signing comes from the git-ignored Config/Signing.local.xcconfig, included by Base.xcconfig (ruling R19).
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
        excludes:
          - Debug/Fixtures
          - Debug/make-demo-fixtures.sh
      # The debug fixtures, as a folder reference: they land in the app bundle under Fixtures/.
      - path: App/Debug/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: PointFlacKit
        product: PFCore
      - package: PointFlacKit
        product: PFFlac
      - package: PointFlacKit
        product: PFAudio
      - package: PointFlacKit
        product: PFLibrary
      - package: PointFlacKit
        product: PFDesign
      - package: PointFlacKit
        product: PFSearch
      - package: PointFlacKit
        product: PFFind
      - package: PointFlacKit
        product: PFDownloads
      - package: PointFlacKit
        product: PFArchive
      # The App Store variant drops this product and the SOULSEEK flag below (spec §5.6 "Build flag"): builds without
      # the flag compile no Soulseek code.
      - package: PointFlacKit
        product: PFSoulseek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kiraa06.pointflac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The sideloaded soft-launch build includes Soulseek, in Debug and Release. The App Store variant removes
        # SOULSEEK here and the PFSoulseek dependency above.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SOULSEEK
      configs:
        # Ruling R4: the fixtures ship only in Debug builds. XcodeGen has no per-configuration sources, so Release
        # drops the folder by name, and the app reads it only under #if DEBUG.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: Fixtures
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: pointFlac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        # Soulseek peers are reached directly; iOS asks before any local-network connection (spec §5.6).
        NSLocalNetworkUsageDescription: >-
          pointFlac connects to other Soulseek users' computers to download FLAC files you choose. It never shares
          or uploads anything.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        # Portrait only for the soft launch: the Deck's layout is phone-portrait (UI review: landscape overflows and the
        # tonearm geometry degenerates on wide plinths). UIRequiresFullScreen opts out of iPad multitasking, which
        # would otherwise require every orientation. Revisit with the iPad layouts.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
  PointFlacUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: PointFlac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kiraa06.pointflac.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PointFlac:
    build:
      targets:
        PointFlac: all
    test:
      targets:
        - PointFlacUITests
