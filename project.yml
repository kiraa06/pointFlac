name: PointFlac
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  PointFlacKit:
    path: Packages/PointFlacKit
targets:
  PointFlac:
    type: application
    platform: iOS
    # Signing comes from the git-ignored Config/Signing.local.xcconfig, included by Base.xcconfig (ruling R19).
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
        excludes:
          - Debug/Fixtures
      # The debug fixtures, as a folder reference: they land in the app bundle under Fixtures/.
      - path: App/Debug/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: PointFlacKit
        product: PFCore
      - package: PointFlacKit
        product: PFFlac
      - package: PointFlacKit
        product: PFAudio
      - package: PointFlacKit
        product: PFLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kiraa06.pointflac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Ruling R4: the fixtures ship only in Debug builds. XcodeGen has no per-configuration sources, so Release
        # drops the folder by name, and the app reads it only under #if DEBUG.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: Fixtures
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: pointFlac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        # Xcode's template defaults. iPad multitasking needs every orientation; without them device builds warn.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  PointFlacUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: PointFlac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kiraa06.pointflac.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PointFlac:
    build:
      targets:
        PointFlac: all
    test:
      targets:
        - PointFlacUITests
